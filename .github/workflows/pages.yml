name: Build and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: '发布到 Pages（关闭则只生成可下载的预览产物）'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch, verify, regenerate, test and build
        run: npm run reproduce
      - name: Check reproducible generated data
        run: git diff --exit-code -- features/ep/generated
      - uses: actions/upload-artifact@v4
        with:
          name: feature-atlas-preview
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
